# Use the IDE's bundled Kotlin runtime — don't ship our own stdlib.
kotlin.stdlib.default.dependency=false
org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=false
# The Kotlin 1.9 compiler can't run on JDK 26, so the daemon runs on JDK 17 — see
# gradle/gradle-daemon-jvm.properties (portable: detected/provisioned per machine).
# Compile Kotlin inside that daemon rather than a separately-forked one.
kotlin.compiler.execution.strategy=in-process
